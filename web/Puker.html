		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
	background: #091419;
}

body {
	color: white;
	background:
		radial-gradient(circle at top, rgba(37, 116, 92, 0.24), transparent 42%),
		linear-gradient(180deg, #14272c 0%, #091419 72%);
	touch-action: none;
	position: fixed;
	inset: 0;
	width: 100vw;
	height: var(--app-height, 100dvh);
	font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
}

#canvas {
	display: block;
	width: 100vw;
	height: var(--app-height, 100dvh);
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	width: 100vw;
	height: var(--app-height, 100dvh);
	background:
		radial-gradient(circle at top, rgba(37, 116, 92, 0.22), transparent 38%),
		linear-gradient(180deg, #14272c 0%, var(--gd-splash-color, #091114) 70%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1rem;
	visibility: hidden;
	z-index: 2;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	z-index: 0;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: min(420px, 50vw);
	margin: 0 auto;
	accent-color: #e6ba68;
	z-index: 2;
}

#status-notice {
	position: relative;
	max-width: min(720px, calc(100vw - 2rem));
	background-color: #14272c;
	border-radius: 0.5rem;
	border: 1px solid #365049;
	color: #edf2e9;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 3;
}

#status.status--notice #status-splash {
	opacity: 0.14;
	filter: blur(2px);
}

#build-version {
	position: fixed;
	right: max(12px, env(safe-area-inset-right));
	bottom: max(10px, env(safe-area-inset-bottom));
	padding: 0.35rem 0.6rem;
	border: 1px solid rgba(230, 186, 104, 0.45);
	border-radius: 999px;
	background: rgba(9, 20, 25, 0.76);
	color: rgba(237, 242, 233, 0.9);
	font: 600 12px/1 "Segoe UI", "Microsoft JhengHei", sans-serif;
	letter-spacing: 0.04em;
	pointer-events: none;
	user-select: none;
	z-index: 3;
	backdrop-filter: blur(6px);
}

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" style="--gd-splash-color: #091114;">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="Puker.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<div id="build-version" hidden></div>

		<script src="Puker.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"Puker","experimentalVK":false,"fileSizes":{"Puker.pck":17340108,"Puker.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"Puker.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const versionMeta = document.querySelector('meta[name="puker-version"]');
	const versionBadge = document.getElementById('build-version');

	function syncViewportHeight() {
		const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
		document.documentElement.style.setProperty('--app-height', `${viewportHeight}px`);
	}

	if (versionMeta && versionMeta.content) {
		versionBadge.textContent = versionMeta.content;
		versionBadge.hidden = false;
	}

	syncViewportHeight();
	window.addEventListener('resize', syncViewportHeight);
	window.addEventListener('orientationchange', syncViewportHeight);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', syncViewportHeight);
	}

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let loadWatchdog = null;

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			if (loadWatchdog) {
				window.clearTimeout(loadWatchdog);
				loadWatchdog = null;
			}
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		loadWatchdog = window.setTimeout(() => {
			displayFailureNotice('載入時間過長。\n若你剛更新過 Web 匯出，請重新整理一次。\n若仍卡住，請清除這個網站的 PWA / Service Worker 快取後再試。');
		}, 15000);
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
